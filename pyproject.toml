[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent-ats-groq"
version = "0.1.0"
description = "Multi-agent ATS resume screening system powered by Groq API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ats-run = "ats_multiagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
